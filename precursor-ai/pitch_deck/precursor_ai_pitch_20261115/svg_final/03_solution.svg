  <g id="claim" data-pptx-bounds="64 190 500 200">
    <text font-size="32" fill="#F4F6FA" x="64" y="230">One platform that turns NASA</text><text font-size="32" fill="#F4F6FA" x="64" y="274">radar and environmental data</text><text font-size="32" fill="#F4F6FA" x="64" y="318"><tspan>into a <tspan fill="#2DD4BF" font-weight="bold">landslide early-warning</tspan></tspan></text><text font-size="32" fill="#F4F6FA" x="64" y="362"><tspan><tspan fill="#2DD4BF" font-weight="bold">map</tspan> for any area.</tspan></text></g>
  <g id="steps" data-pptx-bounds="610 130 606 500" font-size="24" fill="#F4F6FA">
    <line x1="632" y1="170" x2="632" y2="520" stroke="#2DD4BF" stroke-width="1.5" marker-end="url(#arrowTeal)" />
    <g id="step-1">
      <circle cx="632" cy="170" r="7" fill="#2DD4BF" />
      <text x="660" y="176" font-family="Consolas, monospace" font-size="16" fill="#2DD4BF">01</text>
      <text x="708" y="178">Pick an area on the map.</text>
    </g>
    <g id="step-2">
      <circle cx="632" cy="262" r="7" fill="#2DD4BF" />
      <text x="660" y="268" font-family="Consolas, monospace" font-size="16" fill="#2DD4BF">02</text>
      <text x="708" y="270">The platform finds, downloads and checks</text><text x="708" y="304">the NASA data.</text></g>
    <g id="step-3">
      <circle cx="632" cy="354" r="7" fill="#2DD4BF" />
      <text x="660" y="360" font-family="Consolas, monospace" font-size="16" fill="#2DD4BF">03</text>
      <text x="708" y="362">It measures ground movement with <tspan fill="#2DD4BF" font-weight="bold">InSAR</tspan>.</text>
    </g>
    <g id="step-4">
      <circle cx="632" cy="446" r="7" fill="#2DD4BF" />
      <text x="660" y="452" font-family="Consolas, monospace" font-size="16" fill="#2DD4BF">04</text>
      <text x="708" y="454">It combines movement with terrain, rain,</text><text x="708" y="488">soil moisture and landslide history.</text></g>
    <g id="step-5">
      <rect x="624" y="530" width="16" height="16" rx="2" fill="#F2994A" />
      <text x="660" y="544" font-family="Consolas, monospace" font-size="16" fill="#F2994A">05</text>
      <text x="708" y="546"><tspan><tspan font-weight="bold">Risk estimate:</tspan> <tspan font-style="italic" fill="#9AA8C2">Lorem ipsum dolor sit</tspan></tspan></text><text x="708" y="580" font-style="italic" fill="#9AA8C2">amet, consectetur adipiscing elit.</text><text x="708" y="612" font-family="Consolas, monospace" font-size="16" letter-spacing="2" fill="#F2994A">TO FILL</text>
