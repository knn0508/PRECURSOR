      <text x="700" y="440"><tspan>Radar satellite data exists, but it is <tspan fill="#2DD4BF" font-weight="bold">huge</tspan></tspan></text><text x="700" y="476"><tspan><tspan fill="#2DD4BF" font-weight="bold">and technical</tspan>, so decision makers rarely</tspan></text><text x="700" y="512">use it.</text></g>
